name: Build iOS Simulator App (Appetize.io)

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor iOS & Pods
        run: |
          npx cap sync ios
          cd ios/App && pod install

      - name: Build iOS Simulator App
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Debug \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Zip App for Appetize
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r Appetize-iOS-App.zip App.app

      - name: Upload Artifact for Appetize.io
        uses: actions/upload-artifact@v4
        with:
          name: Appetize-iOS-App
          path: build/Build/Products/Debug-iphonesimulator/Appetize-iOS-App.zip
          retention-days: 7
